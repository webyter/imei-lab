services:
  - type: web
    name: imei-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 imei_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: IMEI_MIN_IPHONE
        value: "13"
      - key: RATE_LIMIT
        value: "120"
      - key: TRUST_PROXY
        value: "1"
