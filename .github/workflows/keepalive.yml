name: Render keep-alive

# Pings the deployed service so Render's free tier does not spin down
# (~15 min idle). Set the repo secret RENDER_URL to your service root,
# e.g. https://imei-lab.onrender.com  (Settings -> Secrets -> Actions).
on:
  schedule:
    - cron: "*/14 * * * *"   # every ~14 min (GitHub's minimum is 5 min)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Missing secret RENDER_URL (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          curl -fsS -m 30 --retry 3 --retry-delay 5 "$URL/health" && echo " OK"
